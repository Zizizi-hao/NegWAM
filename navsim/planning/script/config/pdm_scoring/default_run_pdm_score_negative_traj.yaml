hydra:
  run:
    dir: ${output_dir}
  output_subdir: ${output_dir}/code/hydra           # Store hydra's config breakdown here for debugging
  searchpath:                                       # Only <exp_dir> in these paths are discoverable
    - pkg://navsim.planning.script.config.common
  job:
    chdir: False

defaults:
  - default_common
  - default_evaluation
  - default_dataset_paths
  - scorer: pdm_scorer
  - agent: constant_velocity_agent
  - _self_
  - override train_test_split: navmini

simulator:
  _target_: navsim.planning.simulation.planner.pdm_planner.simulation.pdm_simulator.PDMSimulator
  _convert_: 'all'
  proposal_sampling: ${proposal_sampling}


vocab_path: ???
save_dir: xxx/dataset/cache/negative_traj_cache/${train_test_split}
ade_threshold_m: 1.0
pdm_score_threshold: 0.0  # negative
metric_cache_path: xxx/dataset/cache/metric_cache

