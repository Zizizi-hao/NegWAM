_target_: navsim.agents.drivewam.drivewam_agent.DrivewamAgent
_convert_: 'all'

trajectory_sampling:
    _target_: nuplan.planning.simulation.trajectory.trajectory_sampling.TrajectorySampling
    _convert_: 'all'
    time_horizon: 4
    interval_length: 0.5
config:
  _target_: navsim.agents.drivewam.drivewam_config.DrivewamConfig
  _convert_: 'all'
  latent: False
  learning_rate: 2e-6
  dataset_path: xxx/dataset/cache/feature_cache/navmini
  save_root: ${output_dir}
  num_video_steps: 3
  num_action_steps: 10
  checkpoint_path: null
checkpoint_path: ${.config.checkpoint_path}
